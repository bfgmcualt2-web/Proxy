name = "robust-proxy-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
TARGET_HOST = "example.com"
TARGET_SCHEME = "https"
ALLOWED_ASSET_HOSTS = "cdn.example.com,static.example.com,assets.example.com,cloudcdn.example.com"

[env.production]
name = "robust-proxy-worker-prod"

[[routes]]
pattern = "proxy.example.com/*"
zone_name = "example.com"
